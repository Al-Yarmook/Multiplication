<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة فرسان جدول الضرب - تقارير الأداء الشاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d81b60;
            --primary-hover: #ad1457;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

        .container { max-width: 1200px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        header { background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-bottom: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: var(--primary); font-size: 20px; font-weight: 900; }

        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .card h2 { color: var(--primary); font-size: 17px; margin-bottom: 12px; font-weight: 800; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #475569; }
        .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: 'Cairo'; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }

        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-green { background: #2e7d32; }
        .btn-dark { background: #334155; }
        .btn-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }

        .report-preview-area { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-top: 10px; }
        
        .report-header { text-align: center; margin-bottom: 20px; }
        .report-logo { max-height: 80px; display: block; margin: 0 auto 10px auto; object-fit: contain; }
        .report-title { font-size: 18px; font-weight: bold; color: #1e293b; }

        .section-page-break { page-break-before: always; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #cbd5e1; }

        .report-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 13px; }
        .report-table th, .report-table td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: center; }
        .report-table th { background: #f1f5f9; color: #1e293b; font-weight: bold; }

        .footer-table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .footer-table td { border: none !important; padding: 10px; text-align: center; vertical-align: top; }
        .footer-editable-cell { width: 100%; min-height: 60px; background: transparent; border: none; text-align: center; font-family: 'Cairo'; resize: none; outline: none; }

        .hidden { display: none !important; }

        @media print {
            body { background: white; padding: 0; }
            header, .card:not(#reportOutputCard), .btn-row { display: none !important; }
            .report-preview-area { box-shadow: none; padding: 0; }
            .section-page-break { page-break-before: always; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="headerTitle">📊 نظام التقارير الشاملة - منصة فرسان جدول الضرب</h1>
            <a href="adm_scores.html" class="btn btn-dark" style="padding: 6px 12px; font-size: 13px;">← العودة للوحة التحكم</a>
        </header>

        <!-- قسم إعدادات التقارير الافتراضية (للمدير فقط) -->
        <div class="card hidden" id="adminSettingsCard">
            <h2>⚙️ إعدادات التقارير الافتراضية (خاص بمدير النظام)</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>رفع شعار رأس التقرير:</label>
                    <input type="file" id="logoUploadInput" accept="image/*" onchange="handleLogoUpload(event)">
                </div>
                <div class="form-group">
                    <label>حجم خط خلايا الفوتر:</label>
                    <select id="footerFontSize" onchange="updateFooterStyle()">
                        <option value="11px">صغير (11 بكسل)</option>
                        <option value="13px" selected>متوسط (13 بكسل)</option>
                        <option value="15px">كبير (15 بكسل)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- قسم فلاتر وتوليد التقرير -->
        <div class="card">
            <h2>🔍 فلاتر إعداد وتوليد التقرير</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>المرحلة الدراسية:</label>
                    <select id="filterGrade" onchange="updateSectionsFilter()">
                        <option value="all">جميع المراحل</option>
                        <option value="3">الصف الثالث</option>
                        <option value="4">الصف الرابع</option>
                        <option value="5">الصف الخامس</option>
                        <option value="6">الصف السادس</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الفرقة / الشعبة (يمكن اختيار عدة فرق):</label>
                    <select id="filterSections" multiple style="height: 90px;">
                        <!-- يتم تعبئتها ديناميكياً حسب صلاحيات المستخدم -->
                    </select>
                    <small style="color: #64748b; font-size: 11px;">اضغط مع الاستمرار على Ctrl لتحديد عدة فرق.</small>
                </div>
                <div class="form-group">
                    <label>نطاق الطلاب في التقرير:</label>
                    <select id="reportScope">
                        <option value="active">الطلاب المتفاعلين فقط (الذين لعبوا وتفاعلوا)</option>
                        <option value="all">جميع الطلاب (من بيانات الطلبة المسجلين كاملاً)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اتجاه الصفحة للطباعة:</label>
                    <select id="pageOrientation">
                        <option value="portrait">عمودي (Portrait)</option>
                        <option value="landscape" selected>أفقي (Landscape)</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: 15px;">
                <label style="font-size: 13px; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">أعمدة التقرير المطلوبة:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="name" checked> اسم الطالب</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="cls" checked> الفرقة</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="total" checked> مجموع الدرجات الكلي</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="rocket" checked> سباق صواريخ الفضاء</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="goldmine" checked> منجم الذهب</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="mountain" checked> الصعود نحو القمة</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="snake" checked> الحية والسلم</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="rank_school" checked> تصنيف المدرسة</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="rank_section" checked> تصنيف الفرقة</label>
                    <label class="checkbox-label"><input type="checkbox" class="col-check" value="rank_grade" checked> تصنيف المرحلة (الصف)</label>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn" onclick="generateReport()">⚡ توليد وعرض التقرير</button>
            </div>
        </div>

        <!-- قسم عرض نتائج التقرير -->
        <div class="card hidden" id="reportOutputCard">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>📄 معاينة التقرير الجاهز للطباعة</h2>
                <div class="btn-row" style="margin:0;">
                    <button class="btn btn-green" onclick="exportToExcel()">📊 تصدير إلى Excel</button>
                    <button class="btn btn-dark" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
                </div>
            </div>

            <div class="report-preview-area" id="reportPreviewContent">
                <!-- سيتم حقن المحتوى هنا ديناميكياً -->
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 20px; font-size: 13px; color: #64748b;">
        إعداد أ. صادق القلعاوي | مدرسة اليرموك الابتدائية للبنين 🏫✨
    </footer>

    <script>
        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('current_staff_user')); } catch (e) {}

        if (!currentUser) {
            window.location.href = 'staff.html';
        }

        const allSections = ['3ب1', '3ب2', '4ب1', '4ب2', '4ب3', '5ب1', '5ب2', '5ب3', '6ب1', '6ب2'];

        document.addEventListener('DOMContentLoaded', () => {
            checkUserPermissions();
            updateSectionsFilter();
        });

        function checkUserPermissions() {
            const role = currentUser ? String(currentUser.role || '').trim().toLowerCase() : 'admin';
            if (role === 'admin' || role === 'مدير' || role === 'administrator') {
                document.getElementById('adminSettingsCard').classList.remove('hidden');
            }
        }

        function updateSectionsFilter() {
            const gradeVal = document.getElementById('filterGrade').value;
            const selectEl = document.getElementById('filterSections');
            selectEl.innerHTML = '';

            const roleVal = currentUser ? String(currentUser.role || '').trim().toLowerCase() : 'admin';
            const isTeacher = (roleVal === 'teacher' || roleVal === 'معلم');
            
            // استخراج صفوف المعلم المسندة له في حسابه
            let teacherClasses = (isTeacher && currentUser.classes) 
                ? currentUser.classes.split(',').map(c => c.trim()) 
                : [];

            // إذا كان معلم وليس لديه صفوف مسندة
            let availableSections = isTeacher ? teacherClasses : allSections;

            let filtered = availableSections;
            if (gradeVal !== 'all') {
                filtered = availableSections.filter(s => s.startsWith(gradeVal));
            }

            if (filtered.length === 0) {
                let opt = document.createElement('option');
                opt.disabled = true;
                opt.textContent = isTeacher ? 'لا توجد صفوف مسندة لحسابك في هذه المرحلة' : 'لا توجد شعب متاحة';
                selectEl.appendChild(opt);
                return;
            }

            filtered.forEach(sec => {
                let opt = document.createElement('option');
                opt.value = sec;
                opt.textContent = `الشعبة: ${sec}`;
                opt.selected = true; // تحديد الكل افتراضياً
                selectEl.appendChild(opt);
            });
        }

        let savedLogoBase64 = localStorage.getItem('report_custom_logo') || '';

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savedLogoBase64 = e.target.result;
                    localStorage.setItem('report_custom_logo', savedLogoBase64);
                    alert('✅ تم تحديث شعار التقرير بنجاح!');
                };
                reader.readAsDataURL(file);
            }
        }

        function updateFooterStyle() {
            const size = document.getElementById('footerFontSize').value;
            document.querySelectorAll('.footer-editable-cell').forEach(cell => {
                cell.style.fontSize = size;
            });
        }

        async function generateReport() {
            const selectedOptions = Array.from(document.getElementById('filterSections').selectedOptions).map(o => o.value);
            if (selectedOptions.length === 0) {
                alert('⚠️ يرجى اختيار فرقة (شعبة) واحدة على الأقل لتوليد التقرير.');
                return;
            }

            const reportScope = document.getElementById('reportScope').value; // 'active' أو 'all'
            const activeCols = Array.from(document.querySelectorAll('.col-check:checked')).map(c => c.value);
            const container = document.getElementById('reportPreviewContent');
            container.innerHTML = '<div style="text-align:center; padding:20px;">جاري سحب بيانات الطلاب والألعاب وإعداد التقارير...</div>';
            document.getElementById('reportOutputCard').classList.remove('hidden');

            try {
                // 1. سحب بيانات الطلاب الأساسية من جدول الطلاب (students)
                const { data: studentsDbData } = await supabaseClient.from('students').select('*');
                
                // 2. سحب درجات الألعاب الأربعة
                const [rocket, goldmine, mountain, snake] = await Promise.all([
                    supabaseClient.from('rocket_scores').select('*'),
                    supabaseClient.from('goldmine_scores').select('*'),
                    supabaseClient.from('mountain_scores').select('*'),
                    supabaseClient.from('snake_scores').select('*')
                ]);

                let studentsMap = {};

                if (reportScope === 'all' && studentsDbData) {
                    studentsDbData.forEach(st => {
                        let name = st.name || st.student_name;
                        let cls = st.cls || st.class_name || 'غير مصنف';
                        let key = name + '_' + cls;
                        studentsMap[key] = { name, cls, rocket: 0, goldmine: 0, mountain: 0, snake: 0, total: 0 };
                    });
                }

                function processScores(data, gameKey) {
                    if (!data) return;
                    data.forEach(item => {
                        let name = item.student_name;
                        let cls = item.cls || 'غير مصنف';
                        let key = name + '_' + cls;
                        if (!studentsMap[key]) {
                            studentsMap[key] = { name, cls, rocket: 0, goldmine: 0, mountain: 0, snake: 0, total: 0 };
                        }
                        let pts = item.points || 0;
                        studentsMap[key][gameKey] = Math.max(studentsMap[key][gameKey], pts);
                    });
                }

                processScores(rocket.data, 'rocket');
                processScores(goldmine.data, 'goldmine');
                processScores(mountain.data, 'mountain');
                processScores(snake.data, 'snake');

                let allStudents = Object.values(studentsMap).map(s => {
                    s.total = s.rocket + s.goldmine + s.mountain + s.snake;
                    return s;
                });

                allStudents.sort((a, b) => b.total - a.total);

                let htmlContent = '';

                selectedOptions.forEach((sec, index) => {
                    let secStudents = allStudents.filter(s => s.cls === sec);
                    secStudents.sort((a, b) => b.total - a.total);

                    if (index > 0) {
                        htmlContent += `<div class="section-page-break"></div>`;
                    }

                    htmlContent += `
                        <div class="report-header">
                            ${savedLogoBase64 ? `<img src="${savedLogoBase64}" class="report-logo">` : ''}
                            <div class="report-title">تقرير أداء الطلاب - الشعبة (${sec})</div>
                            <div style="font-size: 12px; color: #64748b; margin-top: 4px;">نوع التقرير: ${reportScope === 'all' ? 'جميع طلاب الشعبة المسجلين' : 'الطلاب المتفاعلين فقط'} | التاريخ: ${new Date().toLocaleDateString('ar-BH')}</div>
                        </div>
                    `;

                    if (secStudents.length === 0) {
                        htmlContent += `<p style="text-align:center; color:#666; padding:15px;">لا توجد بيانات مسجلة لطلاب هذه الشعبة.</p>`;
                    } else {
                        htmlContent += `<table class="report-table"><thead><tr>`;
                        
                        if (activeCols.includes('name')) htmlContent += `<th>اسم الطالب</th>`;
                        if (activeCols.includes('cls')) htmlContent += `<th>الفرقة</th>`;
                        if (activeCols.includes('total')) htmlContent += `<th>المجموع الكلي</th>`;
                        if (activeCols.includes('rocket')) htmlContent += `<th>صواريخ الفضاء</th>`;
                        if (activeCols.includes('goldmine')) htmlContent += `<th>منجم الذهب</th>`;
                        if (activeCols.includes('mountain')) htmlContent += `<th>الصعود للقمة</th>`;
                        if (activeCols.includes('snake')) htmlContent += `<th>الحية والسلم</th>`;
                        if (activeCols.includes('rank_school')) htmlContent += `<th>تصنيف المدرسة</th>`;
                        if (activeCols.includes('rank_section')) htmlContent += `<th>تصنيف الفرقة</th>`;
                        if (activeCols.includes('rank_grade')) htmlContent += `<th>تصنيف المرحلة</th>`;

                        htmlContent += `</tr></thead><tbody>`;

                        secStudents.forEach((st, sIdx) => {
                            let rankSchool = allStudents.findIndex(x => x.name === st.name && x.cls === st.cls) + 1;
                            let rankSection = sIdx + 1;
                            
                            let gradePrefix = sec.charAt(0);
                            let gradeStudents = allStudents.filter(x => x.cls.startsWith(gradePrefix));
                            gradeStudents.sort((a, b) => b.total - a.total);
                            let rankGrade = gradeStudents.findIndex(x => x.name === st.name && x.cls === st.cls) + 1;

                            htmlContent += `<tr>`;
                            if (activeCols.includes('name')) htmlContent += `<td><b>${st.name}</b></td>`;
                            if (activeCols.includes('cls')) htmlContent += `<td>${st.cls}</td>`;
                            if (activeCols.includes('total')) htmlContent += `<td style="color:var(--primary); font-weight:bold;">⭐ ${st.total}</td>`;
                            if (activeCols.includes('rocket')) htmlContent += `<td>${st.rocket}</td>`;
                            if (activeCols.includes('goldmine')) htmlContent += `<td>${st.goldmine}</td>`;
                            if (activeCols.includes('mountain')) htmlContent += `<td>${st.mountain}</td>`;
                            if (activeCols.includes('snake')) htmlContent += `<td>${st.snake}</td>`;
                            if (activeCols.includes('rank_school')) htmlContent += `<td>المركز ${rankSchool}</td>`;
                            if (activeCols.includes('rank_section')) htmlContent += `<td>المركز ${rankSection}</td>`;
                            if (activeCols.includes('rank_grade')) htmlContent += `<td>المركز ${rankGrade}</td>`;
                            htmlContent += `</tr>`;
                        });

                        htmlContent += `</tbody></table>`;
                    }

                    htmlContent += `
                        <table class="footer-table">
                            <tr>
                                <td><textarea class="footer-editable-cell" placeholder="معلم المادة"></textarea></td>
                                <td><textarea class="footer-editable-cell" placeholder="المشرف التربوي"></textarea></td>
                                <td><textarea class="footer-editable-cell" placeholder="مدير المدرسة"></textarea></td>
                                <td><textarea class="footer-editable-cell" placeholder="ختم المدرسة"></textarea></td>
                                <td><textarea class="footer-editable-cell" placeholder="ملاحظات إضافية"></textarea></td>
                            </tr>
                        </table>
                    `;
                });

                container.innerHTML = htmlContent;
                updateFooterStyle();

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:red; text-align:center;">حدث خطأ أثناء جلب بيانات التقارير.</p>`;
            }
        }

        function exportToExcel() {
            const previewArea = document.getElementById('reportPreviewContent');
            const tables = previewArea.querySelectorAll('table.report-table');
            if (tables.length === 0) {
                alert('⚠️ لا توجد بيانات لتصديرها.');
                return;
            }

            let wb = XLSX.utils.book_new();
            const selectedOptions = Array.from(document.getElementById('filterSections').selectedOptions).map(o => o.value);
            
            tables.forEach((table, idx) => {
                let ws = XLSX.utils.table_to_sheet(table);
                let sheetName = selectedOptions[idx] || `الشعبة_${idx+1}`;
                XLSX.utils.book_append_sheet(wb, ws, sheetName);
            });

            XLSX.writeFile(wb, 'Farosan_Reports.xlsx');
        }
    </script>
</body>
</html>
